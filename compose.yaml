services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orders
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 5s
      retries: 15

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
    environment:
      MYSQL_ROOT_PASSWORD: testpassword
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: orders
      MYSQL_USER: orders
      MYSQL_PASSWORD: password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  mysql_data:
