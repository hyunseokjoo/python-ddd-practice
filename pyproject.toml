[project]
name = "python-ddd-practice"
version = "0.1.0"
description = "FastAPI, DDD, CQRS and transactional Unit of Work example"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.20.0",
    "dependency-injector>=4.49.1",
    "fastapi[standard]>=0.143.1",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pymysql[rsa]>=1.2.3",
    "sqlalchemy>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
